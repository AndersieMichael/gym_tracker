<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0b0d">
<meta name="color-scheme" content="dark">
<title>Gym Tracker</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root {
  --bg: #0a0b0d; --surface: #15171b; --surface2: #1f2228; --line: #2a2e36;
  --text: #f5f6f7; --muted: #8b929e; --accent: #c6ff3d; --accent-ink: #0a0b0d;
  --danger: #ff5c5c; --photo: #e9ebee; --radius: 20px;
  --c-shoulder: #ff9f43; --c-chest: #ff6b8b; --c-back: #4dabf7; --c-legs: #51cf66; --c-legs-home: #20c9b5;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
#app { max-width: 560px; margin: 0 auto; padding: 20px 16px 120px; }

/* Sporty display type: heavy, italic, uppercase */
.display, h1, h2 { font-weight: 900; font-style: italic; text-transform: uppercase; letter-spacing: -.01em; }
h1 { font-size: 34px; line-height: 1.05; margin: 2px 0 4px; }
h2 { font-size: 15px; letter-spacing: .04em; margin: 28px 0 12px; color: var(--text); }
h2 .muted { font-style: normal; }
.eyebrow { font-size: 12px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.stack > * + * { margin-top: 12px; }
.btn {
  border: 1px solid var(--line); background: var(--surface2); border-radius: 14px;
  padding: 10px 14px; font-weight: 800; letter-spacing: .02em;
}
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; text-transform: uppercase; font-style: italic; font-weight: 900; }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.block { width: 100%; padding: 15px; font-size: 16px; }
.btn.sm { padding: 7px 11px; font-size: 13px; border-radius: 11px; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 700; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.chip { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface2); color: var(--muted); margin: 2px 4px 2px 0; }
.back { background: none; border: 0; color: var(--muted); padding: 4px 0; font-weight: 700; }
/* Guide pictures have white backgrounds: blend them into a light panel */
.photo { background: var(--photo); display: flex; align-items: center; justify-content: center; overflow: hidden; }
.photo img { mix-blend-mode: multiply; object-fit: contain; display: block; }

/* Today */
.hero { border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--line); }
.hero .photo { height: 170px; position: relative; }
.hero .photo img { width: 100%; height: 100%; padding: 8px; }
.hero .tagline { position: absolute; left: 12px; top: 12px; }
.hero .body { padding: 14px 16px 16px; }
.hero .title { font-size: 26px; line-height: 1.1; margin: 2px 0 4px; }
.hero .btns { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 14px; }
.hero.plain .body { padding: 18px 16px; }
.goal { margin-top: 12px; }
.goal .bar { height: 8px; border-radius: 99px; background: var(--surface2); overflow: hidden; margin-top: 6px; }
.goal .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.todo { display: grid; gap: 10px; }
.class-row {
  display: flex; align-items: stretch; width: 100%; text-align: left; padding: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
.class-row .bar { width: 5px; flex: none; }
.class-row .info { flex: 1; min-width: 0; padding: 12px 12px 12px 14px; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.class-row .name { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 17px; }
.class-row .photo { width: 104px; flex: none; }
.class-row .photo img { width: 100%; height: 76px; padding: 4px; }
.class-row.done { opacity: .5; }
.badge { align-self: flex-start; font-size: 10.5px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); white-space: nowrap; }
.badge.ok { background: var(--surface2); color: var(--muted); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .d { text-align: center; padding: 8px 0 6px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); font-size: 11px; font-weight: 700; color: var(--muted); }
.week .d b { display: block; font-size: 16px; color: var(--text); }
.week .d.today { border-color: var(--accent); }
.week .d.today b { color: var(--accent); }
.week .dots { display: flex; justify-content: center; gap: 3px; height: 10px; margin-top: 4px; }
.week .dots .dot { width: 8px; height: 8px; }

/* Class page */
.mode { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 5px; margin-top: 14px; }
.mode button { border: 0; background: transparent; border-radius: 12px; padding: 10px; font-weight: 900; font-style: italic; text-transform: uppercase; color: var(--muted); }
.mode button.on { background: var(--accent); color: var(--accent-ink); }
.ex { padding: 0; overflow: hidden; }
.ex .pic { display: block; width: 100%; border: 0; padding: 0; }
.ex .pic img { width: 100%; height: 200px; padding: 6px; }
.ex .body { padding: 14px 16px 16px; }
.ex .num { font-size: 11px; color: var(--accent); font-weight: 900; letter-spacing: .12em; }
.ex .title { font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 19px; line-height: 1.15; }
.target { font-weight: 900; color: var(--accent); white-space: nowrap; }
.tip { font-size: 13px; color: var(--muted); margin-top: 8px; }
.alt { display: flex; align-items: center; gap: 10px; margin-top: 12px; padding: 8px; border: 1px dashed var(--line); border-radius: 14px; }
.alt .photo { width: 64px; height: 48px; border-radius: 10px; flex: none; cursor: zoom-in; }
.alt .photo img { width: 100%; height: 100%; }
.edit-grid { display: grid; grid-template-columns: 1fr 70px 90px; gap: 8px; margin-top: 8px; }
.edit-grid label { font-size: 11px; color: var(--muted); display: block; }
.field { width: 100%; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 11px; }
.sticky { position: fixed; left: 0; right: 0; bottom: 68px; padding: 10px 16px; background: linear-gradient(transparent, var(--bg) 35%); }
.sticky > div { max-width: 528px; margin: 0 auto; }

/* Workout */
.wo-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 12px; margin: -10px 0 8px; border-bottom: 1px solid var(--line); }
.timer { font-variant-numeric: tabular-nums; font-weight: 900; font-size: 26px; font-style: italic; }
.wo-ex .top { display: flex; gap: 12px; align-items: center; }
.wo-ex .top .photo { width: 72px; height: 52px; border-radius: 12px; flex: none; }
.wo-ex .top .photo img { width: 100%; height: 100%; }
.wo-ex .name { font-weight: 900; font-style: italic; text-transform: uppercase; }
.sets { margin-top: 12px; }
.sets .hdr, .setrow { display: grid; grid-template-columns: 28px 1fr 74px 64px 46px; gap: 6px; align-items: center; }
.sets .hdr { font-size: 10.5px; color: var(--muted); font-weight: 800; letter-spacing: .08em; text-transform: uppercase; padding: 0 2px 4px; }
.setrow { padding: 4px 2px; border-radius: 12px; }
.setrow.done { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.setrow .sn { text-align: center; font-weight: 900; color: var(--muted); }
.setrow .prev { background: none; border: 0; color: var(--muted); font-size: 13px; text-align: left; padding: 0; }
.setrow input { width: 100%; text-align: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 4px; font-weight: 700; }
.setrow input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.chk { height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface2); font-weight: 900; color: var(--muted); }
.setrow.done .chk { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.rest {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 80px; z-index: 30;
  background: var(--surface); border: 1.5px solid var(--accent); border-radius: 99px; padding: 8px 8px 8px 18px;
  display: none; align-items: center; gap: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6);
}
.rest.on { display: flex; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .wd { text-align: center; font-size: 10.5px; color: var(--muted); font-weight: 800; letter-spacing: .06em; text-transform: uppercase; padding-bottom: 4px; }
.cal .c {
  min-height: 60px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  padding: 4px 3px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 3px;
}
.cal .c.out { opacity: .3; }
.cal .c.today { border-color: var(--accent); }
.cal .c.today .n { color: var(--accent); }
.cal .c.sel { outline: 2px solid var(--accent); outline-offset: -1px; }
.cal .c .n { font-size: 13px; font-weight: 800; }
.cal .tag { font-size: 9.5px; font-weight: 900; border-radius: 5px; padding: 1px 4px; color: #111; line-height: 1.3; max-width: 100%; overflow: hidden; white-space: nowrap; }
.cal .tag.plan { background: transparent !important; border: 1.5px dashed; color: var(--text); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.sess-detail { margin-top: 8px; font-size: 13px; }
.sess-detail div { padding: 4px 0; border-top: 1px dashed var(--line); }

/* Progress */
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; flex-wrap: wrap; }
.seg button { flex: 1; border: 0; background: transparent; padding: 8px 6px; border-radius: 10px; font-size: 13px; font-weight: 800; color: var(--muted); }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.stat .v { font-size: 24px; font-weight: 900; font-style: italic; }
.stat .l { font-size: 10.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
svg.chart { width: 100%; height: auto; display: block; }
svg.chart text { fill: var(--muted); font-size: 20px; }

/* Tabs, modal */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; height: 68px;
  background: rgba(10, 11, 13, .92); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom);
}
nav.tabs a {
  flex: 1; max-width: 140px; text-decoration: none; color: var(--muted); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs a.on { color: var(--accent); }
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); border-top: 1px solid var(--line); width: 100%; max-width: 560px; border-radius: 24px 24px 0 0; padding: 20px 16px 26px; max-height: 88vh; overflow: auto; }
.overlay.center { align-items: center; padding: 16px; }
.overlay.center img { max-width: 100%; max-height: 80vh; background: #fff; border-radius: 14px; }
.empty { text-align: center; color: var(--muted); padding: 24px 8px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="rest" id="rest"><span class="eyebrow" style="color:var(--text)">Rest <b id="restLeft" class="timer" style="font-size:18px;margin-left:4px">0:00</b></span><button class="btn sm" data-act="rest-add">+30s</button><button class="btn sm primary" data-act="rest-skip">Skip</button></div>
<nav class="tabs" id="tabs">
  <a href="#/" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Today</a>
  <a href="#/calendar" data-tab="calendar"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</a>
  <a href="#/progress" data-tab="progress"><svg viewBox="0 0 24 24"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Progress</a>

</nav>

<script>
// ---------- Your guide (from GYM GUIDE.pdf) ----------
// Names, targets and tips are editable in the app (Class → Edit).
// `alt` = the exercise to do instead (no machine, or training at home).
const PLANS = [
  { id: 'shoulder', name: 'Shoulder Day', short: 'SHO', group: 'shoulder', exercises: [
    { id: 'shoulder-press-machine', name: 'Machine Shoulder Press', img: 'shoulder-press-machine', muscles: ['Front delts', 'Triceps'], sets: 3, reps: '10-12', tip: 'Back flat on the pad. Press up without slamming the elbows locked.' },
    { id: 'lateral-raise-machine', name: 'Machine Lateral Raise', img: 'lateral-raise-machine', muscles: ['Side delts'], sets: 3, reps: '12-15', tip: 'Lead with your elbows and pause at shoulder height.',
      altLabels: ['No machine? Do this instead', 'Machine free? Do this instead'],
      alt: { id: 'dumbbell-lateral-raise', name: 'Dumbbell Lateral Raise', img: 'dumbbell-lateral-raise', muscles: ['Side delts'], sets: 3, reps: '12-15', tip: 'Slight bend in the elbows, raise to shoulder height, lower slowly.' } },
    { id: 'seated-front-raise', name: 'Seated Dumbbell Front Raise', img: 'seated-front-raise', muscles: ['Front delts'], sets: 3, reps: '10-12', tip: 'Raise to eye level. No swinging.' },
    { id: 'face-pull', name: 'Cable Face Pull', img: 'face-pull', muscles: ['Rear delts', 'Upper back'], sets: 3, reps: '15', tip: 'Pull the rope to your face with elbows high, squeeze the shoulder blades.' },
    { id: 'hammer-curl', name: 'Dumbbell Hammer Curl', img: 'hammer-curl', muscles: ['Biceps', 'Forearms'], sets: 3, reps: '10-12', tip: 'Palms face each other, elbows stay by your sides.' },
  ]},
  { id: 'chest', name: 'Chest Day', short: 'CHE', group: 'chest', exercises: [
    { id: 'chest-press-machine', name: 'Machine Chest Press', img: 'chest-press-machine', muscles: ['Chest', 'Triceps', 'Front delts'], sets: 3, reps: '8-12', tip: 'Handles at mid-chest height. Push out, control the way back.' },
    { id: 'pec-deck-fly', name: 'Pec Deck Fly', img: 'pec-deck-fly', muscles: ['Chest'], sets: 3, reps: '12-15', tip: 'Soft elbows. Squeeze the chest in the middle for 1 second.' },
    { id: 'hammer-curl', name: 'Dumbbell Hammer Curl', img: 'hammer-curl-2', muscles: ['Biceps', 'Forearms'], sets: 3, reps: '10-12', tip: 'Palms face each other, elbows stay by your sides.' },
    { id: 'ab-crunch-machine', name: 'Machine Ab Crunch', img: 'ab-crunch-machine', muscles: ['Abs'], sets: 3, reps: '15', tip: 'Curl your spine and breathe out as you crunch. Don\'t pull with the arms.' },
  ]},
  { id: 'back', name: 'Back Day', short: 'BAC', group: 'back', exercises: [
    { id: 'lat-pulldown', name: 'Lat Pulldown', img: 'lat-pulldown', muscles: ['Lats', 'Biceps'], sets: 3, reps: '10-12', tip: 'Pull the bar to your upper chest. Chest up, don\'t lean far back.' },
    { id: 'seated-cable-row', name: 'Seated Cable Row', img: 'seated-cable-row', muscles: ['Mid back', 'Lats'], sets: 3, reps: '10-12', tip: 'Straight back, pull to your belly, squeeze the shoulder blades.' },
    { id: 'deadlift', name: 'Barbell Deadlift', img: 'deadlift', muscles: ['Lower back', 'Glutes', 'Hamstrings'], sets: 4, reps: '5-8', tip: 'Flat back, bar close to the legs, push the floor away.' },
    { id: 'triceps-pushdown', name: 'Cable Triceps Pushdown', img: 'triceps-pushdown', muscles: ['Triceps'], sets: 3, reps: '12-15', tip: 'Elbows pinned to your sides, straighten fully at the bottom.' },
  ]},
  // Leg Day and Leg Day · House Edition combined: each gym exercise has its home version as `alt`
  { id: 'legs', name: 'Leg Day', short: 'LEG', group: 'legs', modes: ['🏋️ Gym', '🏠 Home'], homeName: 'Leg Day · Home', homeShort: 'LEG🏠', exercises: [
    { id: 'barbell-squat', name: 'Barbell Back Squat', img: 'barbell-squat', muscles: ['Quads', 'Glutes'], sets: 4, reps: '6-10', tip: 'Chest up, knees follow the toes, go down to at least parallel.',
      altLabels: ['At home? Do this instead', 'At the gym? Do this instead'],
      alt: { id: 'bodyweight-squat', name: 'Bodyweight Squat', img: 'bodyweight-squat', muscles: ['Quads', 'Glutes'], sets: 3, reps: '15-20', tip: 'Arms forward for balance, sit back and down.' } },
    { id: 'leg-extension', name: 'Leg Extension', img: 'leg-extension', muscles: ['Quads'], sets: 3, reps: '12-15', tip: 'Pause and squeeze at the top, lower slowly.',
      altLabels: ['At home? Do this instead', 'At the gym? Do this instead'],
      alt: { id: 'bulgarian-split-squat', name: 'Bulgarian Split Squat', img: 'bulgarian-split-squat', muscles: ['Quads', 'Glutes'], sets: 3, reps: '10 / leg', tip: 'Back foot on a bench or sofa. Front knee over the foot.' } },
    { id: 'lying-leg-curl', name: 'Lying Leg Curl', img: 'lying-leg-curl', muscles: ['Hamstrings'], sets: 3, reps: '10-12', tip: 'Hips stay down on the pad. Curl your heels to your glutes.',
      altLabels: ['At home? Do this instead', 'At the gym? Do this instead'],
      alt: { id: 'single-leg-rdl', name: 'Single-Leg Romanian Deadlift', img: 'single-leg-rdl', muscles: ['Hamstrings', 'Glutes'], sets: 3, reps: '10 / leg', tip: 'Hinge at the hip with a flat back, slight bend in the standing knee.' } },
    { id: 'leg-press', name: 'Leg Press', img: 'leg-press', muscles: ['Quads', 'Glutes'], sets: 3, reps: '10-12', tip: 'Don\'t lock the knees at the top. Lower back stays on the pad.',
      altLabels: ['At home? Do this instead', 'At the gym? Do this instead'],
      alt: { id: 'glute-bridge', name: 'Glute Bridge', img: 'glute-bridge', muscles: ['Glutes', 'Hamstrings'], sets: 3, reps: '15', tip: 'Push through the heels, squeeze glutes at the top for 1 second.' } },
    { id: 'calf-raise', name: 'Dumbbell Calf Raise', img: 'calf-raise', muscles: ['Calves'], sets: 3, reps: '15-20', tip: 'Use a step. Full stretch at the bottom, pause at the top. Works at the gym and at home.' },
  ]},
];
const GROUPS = { shoulder: 'Shoulders', chest: 'Chest', back: 'Back', legs: 'Legs' };
const COLOR = id => `var(--c-${id})`;

// ---------- Storage ----------
const KEY = 'gymtracker.v1';
const blank = () => ({ sessions: [], planned: [], overrides: {}, settings: { unit: 'kg', rest: 90, useAlt: {} }, active: null });
let db = load();
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) return migrate(Object.assign(blank(), JSON.parse(raw)));
  } catch (e) {}
  return blank();
}
// Older versions had a separate "Leg Day · House Edition" class: it is now Leg Day at home
function migrate(d) {
  const fix = x => { if (x && x.planId === 'legs-home') { x.planId = 'legs'; x.home = true; } };
  d.sessions.forEach(fix); d.planned.forEach(fix); fix(d.active);
  d.settings.useAlt = d.settings.useAlt || {};
  return d;
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn('Could not save', e); }
}

// ---------- Helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const monday = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); return addDays(x, -((x.getDay() + 6) % 7)); };
const fmtDay = (k, opts = { weekday: 'short', day: 'numeric', month: 'short' }) => fromKey(k).toLocaleDateString('en-GB', opts);
const fmtDur = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60, ss = s % 60; return h ? `${h}:${pad(m)}:${pad(ss)}` : `${m}:${pad(ss)}`; };
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isFinite(n) ? n : 0; };
const unit = () => db.settings.unit;
const planById = id => PLANS.find(p => p.id === id);
const ex = e => Object.assign({}, e, db.overrides[e.id] || {});
// every exercise in a plan, including the "instead" versions
const withAlts = list => list.flatMap(e => e.alt ? [e, e.alt] : [e]);
const exName = id => { for (const p of PLANS) for (const e of withAlts(p.exercises)) if (e.id === id) return ex(e).name; return id; };
// slot = the exercise position in the plan; chosen = the version you picked for it
const slotOf = (p, id) => p.exercises.find(x => x.id === id || x.alt?.id === id);
const useAlt = () => (db.settings.useAlt = db.settings.useAlt || {});
const chosen = slot => (slot.alt && useAlt()[slot.id] ? slot.alt : slot);
// Gym / Home switch for plans with `modes`: 'main', 'alt' or 'mix' (some of each)
function planMode(p) {
  const slots = p.exercises.filter(x => x.alt);
  const n = slots.filter(x => useAlt()[x.id]).length;
  return n === 0 ? 'main' : n === slots.length ? 'alt' : 'mix';
}
function setMode(p, mode) { p.exercises.filter(x => x.alt).forEach(x => { useAlt()[x.id] = mode === 'alt'; }); }
// how a session/plan entry is shown: home leg days get their own name, tag and color
function look(x) {
  const p = planById(x.planId);
  return x.home && p.modes
    ? { name: p.homeName, short: p.homeShort, color: COLOR(`${p.id}-home`) }
    : { name: p.name, short: p.short, color: COLOR(p.id) };
}
const daysAgo = k => Math.round((fromKey(dayKey()) - fromKey(k)) / 864e5);
const agoText = k => { const n = daysAgo(k); return n === 0 ? 'today' : n === 1 ? 'yesterday' : `${n} days ago`; };
const sessionsOn = k => db.sessions.filter(s => s.date === k);
const plannedOn = k => db.planned.filter(p => p.date === k);
const lastSessionOf = planId => db.sessions.filter(s => s.planId === planId).sort((a, b) => b.date.localeCompare(a.date) || b.start - a.start)[0];
const lastGroupDate = group => db.sessions.filter(s => planById(s.planId)?.group === group).map(s => s.date).sort().pop();
function lastSetsFor(exId) {
  const s = db.sessions.filter(s => s.exercises?.some(e => e.exId === exId && e.sets.length))
    .sort((a, b) => b.date.localeCompare(a.date) || b.start - a.start)[0];
  return s ? s.exercises.find(e => e.exId === exId).sets : null;
}
const setText = s => (num(s.w) ? `${s.w}×${s.r}` : `${s.r} reps`);
const photo = (img, cls = '', zoom = false) => `<div class="photo ${cls}" ${zoom ? `data-zoom="images/${img}.jpg"` : ''}><img src="images/${img}.jpg" alt="" loading="lazy"></div>`;
const coverImg = p => chosen(p.exercises[0]).img;

// ---------- Modal ----------
function sheet(html, cls = '') {
  const o = document.createElement('div');
  o.className = 'overlay ' + cls;
  o.innerHTML = cls.includes('center') ? html : `<div class="sheet">${html}</div>`;
  o.addEventListener('click', e => { if (e.target === o || e.target.closest('[data-close]')) o.remove(); });
  document.body.appendChild(o);
  return o;
}
function pickClass(title, onPick) {
  const options = PLANS.flatMap(p => p.modes ? [{ p, home: false }, { p, home: true }] : [{ p, home: false }]);
  const o = sheet(`<h2 style="margin-top:0">${esc(title)}</h2><div class="todo">${options.map(({ p, home }) => {
    const l = look({ planId: p.id, home });
    return `<button class="class-row" data-pick="${p.id}" data-home="${home ? 1 : ''}">
      <span class="bar" style="background:${l.color}"></span>
      <span class="info"><span class="name">${esc(l.name)}</span><span class="muted small">${p.exercises.length} exercises</span></span>
      ${photo(home ? p.exercises[0].alt.img : p.exercises[0].img)}</button>`;
  }).join('')}</div>
    <button class="btn block ghost" style="margin-top:12px" data-close>Cancel</button>`);
  o.addEventListener('click', e => { const b = e.target.closest('[data-pick]'); if (b) { o.remove(); onPick(b.dataset.pick, !!b.dataset.home); } });
}

// ---------- Views ----------
function classRow(p, right = '', done = false) {
  const l = lastSessionOf(p.id);
  return `<button class="class-row ${done ? 'done' : ''}" data-go="#/class/${p.id}">
    <span class="bar" style="background:${COLOR(p.id)}"></span>
    <span class="info">${right}<span class="name">${esc(p.name)}</span>
      <span class="muted small">${p.exercises.length} exercises · ${l ? 'last ' + agoText(l.date) : 'not done yet'}</span></span>
    ${photo(coverImg(p))}</button>`;
}

function viewToday() {
  const today = dayKey();
  const ws = monday(new Date());
  const weekKeys = [...Array(7)].map((_, i) => dayKey(addDays(ws, i)));
  const inWeek = s => s.date >= weekKeys[0] && s.date <= weekKeys[6];
  const doneGroups = new Set(db.sessions.filter(inWeek).map(s => planById(s.planId)?.group));
  const todaySess = sessionsOn(today);
  const todayPlan = plannedOn(today);

  // Suggest the not-yet-done group that you trained longest ago
  const todoGroups = Object.keys(GROUPS).filter(g => !doneGroups.has(g))
    .sort((a, b) => (lastGroupDate(a) || '0').localeCompare(lastGroupDate(b) || '0'));
  const suggest = todoGroups[0];

  const bigCard = (p, label, note) => `<div class="hero">
      <div class="photo">${`<img src="images/${coverImg(p)}.jpg" alt="">`}<span class="badge tagline">${label}</span></div>
      <div class="body">
        <div class="display title">${esc(p.name)}</div>
        <div class="muted small">${note}</div>
        <div class="btns">
          ${db.active ? `<button class="btn primary" data-go="#/workout">▶ Continue</button>` : `<button class="btn primary" data-act="start" data-plan="${p.id}">▶ Start</button>`}
          <button class="btn" data-go="#/class/${p.id}">View plan</button>
        </div>
      </div></div>`;

  let hero, headline = "Let's train 💪";
  if (db.active) {
    const p = planById(db.active.planId);
    hero = `<div class="hero"><div class="photo"><img src="images/${coverImg(p)}.jpg" alt=""><span class="badge tagline">In progress</span></div>
      <div class="body"><div class="display title">${esc(p.name)}</div>
      <div class="muted small">Started ${fmtDur((Date.now() - db.active.start) / 1000)} ago</div>
      <div style="margin-top:14px"><button class="btn primary block" data-go="#/workout">▶ Continue workout</button></div></div></div>`;
  } else if (todaySess.length) {
    headline = 'Nice work ✓';
    hero = `<div class="hero plain"><div class="body"><div class="eyebrow" style="color:var(--accent)">Done today</div>
      <div class="display title">${todaySess.map(s => esc(look(s).name)).join(' + ')}</div>
      <div class="muted small">${todaySess.map(s => s.quick ? 'Marked done' : `${fmtDur(s.duration)} · ${s.exercises.reduce((n, e) => n + e.sets.length, 0)} sets`).join(' · ')}</div></div></div>`;
  } else if (todayPlan.length) {
    const p = planById(todayPlan[0].planId);
    hero = bigCard(p, 'Planned today', `${p.exercises.length} exercises`);
  } else if (suggest) {
    const p = PLANS.find(x => x.group === suggest), last = lastGroupDate(suggest);
    hero = bigCard(p, 'Suggested', `You haven't trained ${GROUPS[suggest].toLowerCase()} this week${last ? ` · last ${agoText(last)}` : ''}`);
  } else {
    headline = 'Week done 🎉';
    hero = `<div class="hero plain"><div class="body"><div class="display title">All classes done</div><div class="muted small">Rest, or pick any class below for an extra session.</div></div></div>`;
  }

  const total = Object.keys(GROUPS).length, doneCount = Object.keys(GROUPS).filter(g => doneGroups.has(g)).length;
  const notDone = PLANS.filter(p => !doneGroups.has(p.group));
  const done = PLANS.filter(p => doneGroups.has(p.group));
  return `
    <div class="eyebrow">${fmtDay(today, { weekday: 'long', day: 'numeric', month: 'short' })}</div>
    <h1>${headline}</h1>
    <div style="margin-top:14px">${hero}</div>

    <div class="goal card"><div class="row between"><span class="eyebrow" style="color:var(--text)">Week goal</span><b>${doneCount} / ${total} classes</b></div>
      <div class="bar"><i style="width:${Math.round(doneCount / total * 100)}%"></i></div></div>

    <h2>This week</h2>
    <div class="week">${weekKeys.map(k => {
      const ss = sessionsOn(k), pl = plannedOn(k);
      return `<button class="d ${k === today ? 'today' : ''}" data-go="#/calendar/${k}">${fmtDay(k, { weekday: 'narrow' })}<b>${fromKey(k).getDate()}</b>
        <span class="dots">${ss.map(s => `<span class="dot" style="background:${look(s).color}"></span>`).join('')}${pl.map(x => `<span class="dot" style="border:1.5px dashed ${look(x).color}"></span>`).join('')}</span></button>`;
    }).join('')}</div>

    <h2>Not done this week <span class="muted">(${notDone.length})</span></h2>
    <div class="todo">${notDone.length ? notDone.map(p => classRow(p, p.group === suggest ? '<span class="badge">Suggested</span>' : '')).join('') : '<div class="empty">Every class is done this week. Nice work! 💪</div>'}</div>

    ${done.length ? `<h2>Done this week</h2><div class="todo">${done.map(p => {
      const d = db.sessions.filter(s => planById(s.planId).group === p.group && inWeek(s)).map(s => s.date).sort().pop();
      return classRow(p, `<span class="badge ok">✓ ${d ? fmtDay(d, { weekday: 'short' }) : ''}</span>`, true);
    }).join('')}</div>` : ''}
  `;
}

let editing = false;
function viewClass(id) {
  const p = planById(id);
  if (!p) return viewToday();
  const last = lastSessionOf(id);
  const mode = p.modes && planMode(p);
  return `
    <button class="back" data-back>‹ Back</button>
    <div class="row between" style="align-items:flex-start"><h1 style="display:flex;align-items:center;gap:10px"><span class="dot" style="background:${COLOR(p.id)};width:14px;height:14px"></span>${esc(p.name)}</h1>
      <button class="btn sm" data-act="toggle-edit" style="margin-top:8px">${editing ? 'Done' : 'Edit'}</button></div>
    <div class="muted small">${p.exercises.length} exercises · ${last ? 'last done ' + agoText(last.date) : 'not done yet'}</div>
    ${p.modes ? `<div class="mode">${p.modes.map((label, i) => `<button class="${mode === (i ? 'alt' : 'main') ? 'on' : ''}" data-act="mode" data-plan="${p.id}" data-mode="${i ? 'alt' : 'main'}">${label}</button>`).join('')}</div>
      ${mode === 'mix' ? '<div class="muted small" style="margin-top:6px;text-align:center">Mixed: some gym, some home exercises</div>' : ''}` : ''}
    <div class="stack" style="margin-top:14px">
    ${p.exercises.map((slot, i) => {
      const e = ex(chosen(slot)), prev = lastSetsFor(e.id);
      const other = slot.alt && ex(chosen(slot) === slot ? slot.alt : slot);
      return `<div class="card ex">
        <button class="pic photo" data-zoom="images/${e.img}.jpg"><img src="images/${e.img}.jpg" alt="${esc(e.name)}" loading="lazy"></button>
        <div class="body">
          <div class="num">EXERCISE ${i + 1}</div>
          ${editing ? `<div class="edit-grid">
              <div><label>Name</label><input class="field" data-ov="${e.id}" data-k="name" value="${esc(e.name)}"></div>
              <div><label>Sets</label><input class="field" data-ov="${e.id}" data-k="sets" inputmode="numeric" value="${esc(e.sets)}"></div>
              <div><label>Reps</label><input class="field" data-ov="${e.id}" data-k="reps" value="${esc(e.reps)}"></div>
            </div>` : `<div class="row between" style="align-items:flex-start"><div class="title">${esc(e.name)}</div><div class="target">${esc(e.sets)} × ${esc(e.reps)}</div></div>`}
          <div style="margin-top:6px">${e.muscles.map(m => `<span class="chip">${esc(m)}</span>`).join('')}</div>
          <div class="tip">💡 ${esc(e.tip)}</div>
          ${prev ? `<div class="small" style="margin-top:8px"><span class="muted">Last time:</span> <b>${prev.map(s => setText(s)).join(', ')}</b> ${num(prev[0].w) ? unit() : ''}</div>` : ''}
          ${other ? `<div class="alt">
            ${photo(other.img, '', true)}
            <div style="flex:1;min-width:0"><div class="muted small">${esc(slot.altLabels[other.id === slot.alt.id ? 0 : 1])}</div><b>${esc(other.name)}</b></div>
            <button class="btn sm" data-act="swap-plan" data-plan="${p.id}" data-slot="${slot.id}">Use this</button>
          </div>` : ''}
        </div></div>`;
    }).join('')}
    </div>
    <div style="text-align:center;margin-top:18px"><button class="link" data-act="quick" data-plan="${p.id}">Already did it? Mark as done today without logging</button></div>
    <div style="height:84px"></div>
    <div class="sticky"><div>${db.active
      ? `<button class="btn primary block" data-go="#/workout">▶ Continue current workout</button>`
      : `<button class="btn primary block" data-act="start" data-plan="${p.id}">▶ Start ${esc(p.modes && mode === 'alt' ? p.homeName : p.name)}</button>`}</div></div>
  `;
}

function viewWorkout() {
  const a = db.active;
  if (!a) { location.hash = '#/'; return ''; }
  const p = planById(a.planId);
  return `
    <div class="wo-head"><div class="row between">
      <div><div class="eyebrow">${esc(p.name)}</div><div class="timer" data-elapsed>${fmtDur((Date.now() - a.start) / 1000)}</div></div>
      <div class="row"><button class="btn sm ghost danger" data-act="cancel">Cancel</button><button class="btn sm primary" data-act="finish">Finish</button></div>
    </div></div>
    <div class="stack">
    ${a.exercises.map((we, i) => {
      const slot = slotOf(p, we.exId), e = ex(slot.alt?.id === we.exId ? slot.alt : slot), prev = lastSetsFor(e.id) || [];
      const other = slot.alt && ex(slot.alt.id === we.exId ? slot : slot.alt);
      return `<div class="card wo-ex">
        <div class="top">${photo(e.img, '', true)}
          <div style="flex:1"><div class="name">${esc(e.name)}</div><div class="small muted">Target <span class="target">${esc(e.sets)} × ${esc(e.reps)}</span></div></div></div>
        <div class="sets">
          <div class="hdr"><span style="text-align:center">Set</span><span>Previous</span><span style="text-align:center">${unit()}</span><span style="text-align:center">Reps</span><span></span></div>
          ${we.sets.map((s, j) => {
            const pv = prev[j];
            return `<div class="setrow ${s.done ? 'done' : ''}" data-i="${i}" data-j="${j}">
              <span class="sn">${j + 1}</span>
              <button class="prev" data-act="copy-prev" ${pv ? '' : 'disabled'}>${pv ? esc(setText(pv)) : '—'}</button>
              <input inputmode="decimal" data-f="w" value="${esc(s.w)}" placeholder="${pv ? esc(pv.w || '') : ''}">
              <input inputmode="numeric" data-f="r" value="${esc(s.r)}" placeholder="${pv ? esc(pv.r) : esc(String(e.reps).match(/\d+/)?.[0] || '')}">
              <button class="chk" data-act="check">✓</button>
            </div>`;
          }).join('')}
        </div>
        <div class="row" style="margin-top:10px;flex-wrap:wrap">
          <button class="btn sm" data-act="add-set" data-i="${i}">+ Add set</button>
          ${we.sets.length > 1 ? `<button class="btn sm ghost" data-act="del-set" data-i="${i}">− Remove set</button>` : ''}
          ${other ? `<button class="btn sm ghost" data-act="swap-wo" data-i="${i}" title="Switch to ${esc(other.name)}">⇄ ${esc(other.name)}</button>` : ''}
        </div>
      </div>`;
    }).join('')}
    </div>
    <p class="muted small" style="text-align:center">Tip: tap “Previous” to copy last time's numbers. Leave the weight empty for bodyweight.</p>
  `;
}

let calMonth = null, calSel = null, calHashSel = null;
function viewCalendar(sel) {
  const today = dayKey();
  // a day in the URL (from Today's week strip or a tapped cell) jumps to its month
  if (sel && sel !== calHashSel) { calHashSel = sel; calSel = sel; calMonth = fromKey(sel); }
  calSel = calSel || today;
  if (!calMonth) calMonth = fromKey(calSel);
  const first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  const start = monday(first);
  const cells = [...Array(42)].map((_, i) => addDays(start, i));
  const monthTotal = db.sessions.filter(s => fromKey(s.date).getMonth() === first.getMonth() && fromKey(s.date).getFullYear() === first.getFullYear()).length;
  const ss = sessionsOn(calSel), pl = plannedOn(calSel);
  const future = calSel > today;
  const legend = PLANS.flatMap(p => p.modes ? [look({ planId: p.id }), look({ planId: p.id, home: true })] : [look({ planId: p.id })]);
  return `
    <div class="eyebrow">${monthTotal} workout${monthTotal === 1 ? '' : 's'} this month</div>
    <h1>Calendar</h1>
    <div class="row between" style="margin:12px 0">
      <button class="btn sm" data-act="month" data-d="-1">‹</button>
      <div class="display" style="font-size:18px">${first.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</div>
      <button class="btn sm" data-act="month" data-d="1">›</button>
    </div>
    <div class="cal">
      ${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => `<div class="wd">${d}</div>`).join('')}
      ${cells.map(d => {
        const k = dayKey(d);
        return `<button class="c ${d.getMonth() !== first.getMonth() ? 'out' : ''} ${k === today ? 'today' : ''} ${k === calSel ? 'sel' : ''}" data-day="${k}">
          <span class="n">${d.getDate()}</span>
          ${sessionsOn(k).map(s => `<span class="tag" style="background:${look(s).color}">${esc(look(s).short)}</span>`).join('')}
          ${plannedOn(k).map(x => `<span class="tag plan" style="border-color:${look(x).color}">${esc(look(x).short)}</span>`).join('')}
        </button>`;
      }).join('')}
    </div>
    <div class="legend">${legend.map(l => `<span><span class="dot" style="background:${l.color}"></span>${esc(l.name)}</span>`).join('')}<span><span class="dot" style="border:1.5px dashed var(--muted)"></span>Planned</span></div>

    <h2>${fmtDay(calSel, { weekday: 'long', day: 'numeric', month: 'long' })}${calSel === today ? ' · Today' : ''}</h2>
    <div class="stack">
      ${ss.map(s => {
        const l = look(s);
        return `<div class="card"><div class="row between">
            <div class="row"><span class="dot" style="background:${l.color}"></span><b class="display">${esc(l.name)}</b></div>
            <button class="btn sm ghost danger" data-act="del-session" data-id="${s.id}">Delete</button></div>
          <div class="muted small">${s.quick ? 'Marked as done (no sets logged)' : `${fmtDur(s.duration)} · ${s.exercises.reduce((n, e) => n + e.sets.length, 0)} sets · ${Math.round(volume(s))} ${unit()} volume`}</div>
          ${s.quick ? '' : `<div class="sess-detail">${s.exercises.filter(e => e.sets.length).map(e => `<div><b>${esc(exName(e.exId))}</b> <span class="muted">${e.sets.map(setText).join(', ')}</span></div>`).join('')}</div>`}
        </div>`;
      }).join('')}
      ${pl.map(x => {
        const l = look(x);
        return `<div class="card" style="border-style:dashed;border-color:${l.color}"><div class="row between">
            <div><div class="eyebrow">Planned</div><b class="display">${esc(l.name)}</b></div>
            <div class="row">${calSel <= today ? `<button class="btn sm primary" data-act="open-plan" data-id="${x.id}">Open</button>` : ''}<button class="btn sm ghost danger" data-act="del-plan" data-id="${x.id}">Remove</button></div>
          </div></div>`;
      }).join('')}
      ${!ss.length && !pl.length ? `<div class="empty">${future ? 'Nothing planned yet.' : 'Rest day — no class logged.'}</div>` : ''}
      <button class="btn block" data-act="add-day" data-day="${calSel}">${future ? '+ Plan a class for this day' : '+ Add a class to this day'}</button>
    </div>
  `;
}

const volume = s => s.exercises.reduce((v, e) => v + e.sets.reduce((a, x) => a + num(x.w) * num(x.r), 0), 0);

let progEx = null, progMetric = 'top';
function viewProgress() {
  const all = [];
  PLANS.forEach(p => withAlts(p.exercises).forEach(e => { if (!all.some(a => a.id === e.id)) all.push({ id: e.id, plan: p }); }));
  const logged = new Set(db.sessions.flatMap(s => (s.exercises || []).filter(e => e.sets.length).map(e => e.exId)));
  if (!progEx) progEx = all.find(a => logged.has(a.id))?.id || all[0].id;

  const pts = db.sessions.filter(s => s.exercises?.some(e => e.exId === progEx && e.sets.length))
    .sort((a, b) => a.date.localeCompare(b.date) || a.start - b.start)
    .map(s => {
      const sets = s.exercises.find(e => e.exId === progEx).sets;
      return {
        date: s.date,
        top: Math.max(...sets.map(x => num(x.w))),
        e1rm: Math.max(...sets.map(x => num(x.w) * (1 + num(x.r) / 30))),
        vol: sets.reduce((a, x) => a + num(x.w) * num(x.r), 0),
        reps: sets.reduce((a, x) => a + num(x.r), 0),
        sets,
      };
    });
  const bw = pts.length && pts.every(p => p.top === 0);
  if (bw) progMetric = 'reps';
  const metrics = bw ? [['reps', 'Total reps']] : [['top', 'Top weight'], ['e1rm', 'Est. 1RM'], ['vol', 'Volume'], ['reps', 'Total reps']];
  const best = pts.length ? Math.max(...pts.map(p => p[progMetric])) : 0;
  const u = progMetric === 'reps' ? 'reps' : unit();

  const workoutsTotal = db.sessions.length;
  const thisMonth = db.sessions.filter(s => s.date.slice(0, 7) === dayKey().slice(0, 7)).length;
  const streak = weekStreak();

  // shared exercises (like the hammer curl) appear once, under the first class that has them
  const seen = new Set();
  return `
    <div class="eyebrow">Your numbers</div>
    <h1>Progress</h1>
    <div class="stats" style="margin-top:14px">
      <div class="stat"><div class="v">${workoutsTotal}</div><div class="l">Workouts</div></div>
      <div class="stat"><div class="v">${thisMonth}</div><div class="l">This month</div></div>
      <div class="stat"><div class="v">${streak}🔥</div><div class="l">Week streak</div></div>
    </div>
    <h2>Exercise</h2>
    <select class="field" data-act="prog-ex">
      ${PLANS.map(p => `<optgroup label="${esc(p.name)}">${withAlts(p.exercises).filter(e => !seen.has(e.id) && seen.add(e.id)).map(e => `<option value="${e.id}" ${e.id === progEx ? 'selected' : ''}>${esc(ex(e).name)}${logged.has(e.id) ? '' : ' (no data)'}</option>`).join('')}</optgroup>`).join('')}
    </select>
    <div class="seg" style="margin-top:10px">${metrics.map(([k, l]) => `<button class="${k === progMetric ? 'on' : ''}" data-act="metric" data-m="${k}">${l}</button>`).join('')}</div>
    <div class="card" style="margin-top:10px">
      ${pts.length >= 1 ? chart(pts.map(p => ({ x: p.date, y: Math.round(p[progMetric] * 10) / 10 })), u) : `<div class="empty">No sets logged for this exercise yet.<br>Start a workout and your progress will show here.</div>`}
    </div>
    ${pts.length ? `<div class="stats" style="margin-top:10px">
      <div class="stat"><div class="v">${Math.round(best * 10) / 10}</div><div class="l">Best (${u})</div></div>
      <div class="stat"><div class="v">${pts.length}</div><div class="l">Sessions</div></div>
      <div class="stat"><div class="v">${pts.length > 1 ? signed(pts.at(-1)[progMetric] - pts[0][progMetric]) : '–'}</div><div class="l">Since first</div></div>
    </div>
    <h2>History</h2>
    <div class="card stack small">${pts.slice().reverse().slice(0, 15).map(p => `<div class="row between"><span class="muted">${fmtDay(p.date)}</span><b>${p.sets.map(setText).join(', ')}</b></div>`).join('')}</div>` : ''}
  `;
}
const signed = n => (n > 0 ? '+' : '') + Math.round(n * 10) / 10;
function weekStreak() {
  let w = monday(new Date()), n = 0;
  const has = d => db.sessions.some(s => s.date >= dayKey(d) && s.date <= dayKey(addDays(d, 6)));
  if (!has(w)) w = addDays(w, -7); // this week not started yet doesn't break the streak
  while (has(w)) { n++; w = addDays(w, -7); }
  return n;
}
function chart(data, u) {
  const W = 600, H = 260, L = 56, R = 16, T = 16, B = 36;
  const ys = data.map(d => d.y);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo = lo - 5; hi = hi + 5; }
  const padY = (hi - lo) * 0.12; lo = Math.max(0, lo - padY); hi = hi + padY;
  const x = i => data.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (data.length - 1);
  const y = v => T + (hi - v) * (H - T - B) / (hi - lo);
  const grid = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3);
  const path = data.map((d, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(d.y).toFixed(1)}`).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart">
    ${grid.map(g => `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${L - 8}" y="${y(g) + 6}" text-anchor="end">${Math.round(g)}</text>`).join('')}
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    ${data.map((d, i) => `<circle cx="${x(i)}" cy="${y(d.y)}" r="6" fill="var(--bg)" stroke="var(--accent)" stroke-width="3"><title>${fmtDay(d.x)}: ${d.y} ${u}</title></circle>`).join('')}
    <text x="${x(0)}" y="${H - 6}" text-anchor="${data.length === 1 ? 'middle' : 'start'}">${fmtDay(data[0].x, { day: 'numeric', month: 'short' })}</text>
    ${data.length > 1 ? `<text x="${x(data.length - 1)}" y="${H - 6}" text-anchor="end">${fmtDay(data.at(-1).x, { day: 'numeric', month: 'short' })}</text>` : ''}
  </svg>`;
}

function viewMore() {
  return `
    <div class="eyebrow">Settings & backup</div>
    <h1>More</h1>
    <h2>Settings</h2>
    <div class="card stack">
      <div class="row between"><span>Weight unit</span>
        <div class="seg" style="width:140px">${['kg', 'lb'].map(u => `<button class="${unit() === u ? 'on' : ''}" data-act="unit" data-u="${u}">${u}</button>`).join('')}</div></div>
      <div class="row between"><span>Rest timer after each set</span>
        <select class="field" style="width:120px" data-act="rest-set">${[0, 60, 90, 120, 180].map(s => `<option value="${s}" ${db.settings.rest === s ? 'selected' : ''}>${s ? fmtDur(s) : 'Off'}</option>`).join('')}</select></div>
    </div>
    <h2>Backup</h2>
    <div class="card stack">
      <div class="muted small">Your data is saved only in this browser on this device. Export a backup now and then, and use Import to move it to another phone or computer.</div>
      <div class="row"><button class="btn" data-act="export">⬇ Export backup</button><button class="btn" data-act="import">⬆ Import backup</button></div>
      <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <h2>Danger zone</h2>
    <div class="card"><button class="btn danger" data-act="reset">Delete all my data</button></div>
    <p class="muted small" style="text-align:center;margin-top:24px">${db.sessions.length} workouts saved · Gym Tracker</p>
  `;
}

// ---------- Router ----------
function render() {
  const [, route, arg] = (location.hash || '#/').split('/');
  const tab = route === 'calendar' ? 'calendar' : route === 'progress' ? 'progress' : route === 'more' ? 'more' : 'today';
  document.querySelectorAll('#tabs a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
  const html = route === 'class' ? viewClass(arg)
    : route === 'workout' ? viewWorkout()
    : route === 'calendar' ? viewCalendar(arg)
    : route === 'progress' ? viewProgress()
    : route === 'more' ? viewMore()
    : viewToday();
  $('#app').innerHTML = html;
}
window.addEventListener('hashchange', () => { editing = false; render(); window.scrollTo(0, 0); });

// ---------- Actions ----------
function startWorkout(planId) {
  const p = planById(planId);
  db.active = { planId, date: dayKey(), start: Date.now(), exercises: p.exercises.map(chosen).map(e => ({ exId: e.id, sets: [...Array(Math.max(1, parseInt(ex(e).sets) || 3))].map(() => ({ w: '', r: '', done: false })) })) };
  db.planned = db.planned.filter(x => !(x.date === dayKey() && x.planId === planId));
  save();
  location.hash = '#/workout';
}
function finishWorkout() {
  const a = db.active, p = planById(a.planId);
  const exercises = a.exercises.map(e => ({ exId: e.exId, sets: e.sets.filter(s => num(s.r) > 0).map(s => ({ w: num(s.w), r: num(s.r) })) }));
  const count = exercises.reduce((n, e) => n + e.sets.length, 0);
  if (!count) {
    if (confirm('No sets logged yet (enter reps for at least one set).\n\nDiscard this workout?')) { db.active = null; save(); location.hash = '#/'; }
    return;
  }
  // personal records: heavier than any previous top weight for that exercise
  const prs = exercises.filter(e => e.sets.length).map(e => {
    const top = Math.max(...e.sets.map(s => s.w));
    const prevTop = Math.max(0, ...db.sessions.flatMap(s => (s.exercises || []).filter(x => x.exId === e.exId).flatMap(x => x.sets.map(y => num(y.w)))));
    return top > prevTop && prevTop > 0 ? `${exName(e.exId)}: ${top} ${unit()} (was ${prevTop})` : null;
  }).filter(Boolean);
  // a leg day counts as "home" when most of its swappable exercises were the home versions
  const altIds = new Set(p.exercises.filter(x => x.alt).map(x => x.alt.id));
  const home = !!p.modes && a.exercises.filter(e => altIds.has(e.exId)).length * 2 > altIds.size;
  const s = { id: uid(), planId: a.planId, date: a.date, start: a.start, duration: Math.round((Date.now() - a.start) / 1000), exercises, ...(home ? { home } : {}) };
  db.sessions.push(s);
  db.active = null;
  stopRest();
  save();
  location.hash = '#/';
  sheet(`<div style="text-align:center;font-size:48px">🎉</div>
    <h1 style="text-align:center;font-size:26px">${esc(look(s).name)} done!</h1>
    <div class="stats" style="margin-top:14px"><div class="stat"><div class="v">${fmtDur(s.duration)}</div><div class="l">Time</div></div>
      <div class="stat"><div class="v">${count}</div><div class="l">Sets</div></div>
      <div class="stat"><div class="v">${Math.round(volume(s))}</div><div class="l">Volume (${unit()})</div></div></div>
    ${prs.length ? `<h2>New records 🏆</h2><div class="card stack small">${prs.map(x => `<div>${esc(x)}</div>`).join('')}</div>` : ''}
    <button class="btn primary block" style="margin-top:16px" data-close>Nice</button>`);
}

let restEnd = 0;
function startRest() { if (db.settings.rest) { restEnd = Date.now() + db.settings.rest * 1000; tick(); } }
function stopRest() { restEnd = 0; $('#rest').classList.remove('on'); }
function tick() {
  const el = $('[data-elapsed]');
  if (el && db.active) el.textContent = fmtDur((Date.now() - db.active.start) / 1000);
  if (restEnd) {
    const left = (restEnd - Date.now()) / 1000;
    if (left <= 0) { stopRest(); try { navigator.vibrate?.([200, 100, 200]); } catch (e) {} }
    else { $('#rest').classList.add('on'); $('#restLeft').textContent = fmtDur(Math.ceil(left)); }
  }
}
setInterval(tick, 1000);

document.addEventListener('click', e => {
  const zoom = e.target.closest('[data-zoom]');
  if (zoom) return sheet(`<img src="${zoom.dataset.zoom}" alt="">`, 'center');
  const go = e.target.closest('[data-go]');
  if (go) { location.hash = go.dataset.go; return; }
  if (e.target.closest('[data-back]')) { history.length > 1 ? history.back() : (location.hash = '#/'); return; }
  const day = e.target.closest('[data-day]:not([data-act])');
  if (day) { calSel = day.dataset.day; const d = fromKey(calSel); if (d.getMonth() !== calMonth.getMonth()) calMonth = d; history.replaceState(null, '', '#/calendar/' + calSel); render(); return; }

  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  const row = b.closest('.setrow');
  const a = db.active;
  switch (act) {
    case 'start': startWorkout(b.dataset.plan); break;
    case 'toggle-edit': editing = !editing; render(); break;
    case 'mode': setMode(planById(b.dataset.plan), b.dataset.mode); save(); render(); break;
    case 'quick': {
      const p = planById(b.dataset.plan), home = !!p.modes && planMode(p) === 'alt';
      if (confirm(`Mark ${home ? p.homeName : p.name} as done today?`)) {
        db.sessions.push({ id: uid(), planId: p.id, date: dayKey(), start: Date.now(), duration: 0, exercises: [], quick: true, ...(home ? { home } : {}) });
        save(); location.hash = '#/';
      }
      break;
    }
    case 'finish': finishWorkout(); break;
    case 'cancel': if (confirm('Cancel this workout? Logged sets will be lost.')) { db.active = null; stopRest(); save(); location.hash = '#/'; } break;
    case 'check': {
      const sets = a.exercises[row.dataset.i].sets, s = sets[row.dataset.j];
      if (!s.done && (!num(s.r) || s.w === '')) {
        // fill empty boxes from last time / the set above / the target, so one tap logs the set
        const [wi, ri] = row.querySelectorAll('input');
        s.w = s.w || wi.placeholder || (row.dataset.j > 0 ? sets[row.dataset.j - 1].w : '');
        s.r = s.r || ri.placeholder; wi.value = s.w; ri.value = s.r;
        if (!num(s.r)) { ri.focus(); return; }
      }
      s.done = !s.done; row.classList.toggle('done', s.done); save();
      s.done ? startRest() : stopRest();
      break;
    }
    case 'copy-prev': {
      const pv = (lastSetsFor(a.exercises[row.dataset.i].exId) || [])[row.dataset.j];
      if (!pv) return;
      const s = a.exercises[row.dataset.i].sets[row.dataset.j];
      s.w = pv.w || ''; s.r = pv.r; save(); render();
      break;
    }
    case 'swap-plan': {
      const slot = planById(b.dataset.plan).exercises.find(x => x.id === b.dataset.slot);
      useAlt()[slot.id] = !useAlt()[slot.id]; save(); render();
      break;
    }
    case 'swap-wo': {
      // keeps the numbers you already typed, and remembers the choice for next time
      const we = a.exercises[b.dataset.i], slot = slotOf(planById(a.planId), we.exId);
      we.exId = we.exId === slot.id ? slot.alt.id : slot.id;
      useAlt()[slot.id] = we.exId !== slot.id; save(); render();
      break;
    }
    case 'add-set': { const sets = a.exercises[b.dataset.i].sets; const l = sets.at(-1); sets.push({ w: l?.w || '', r: '', done: false }); save(); render(); break; }
    case 'del-set': a.exercises[b.dataset.i].sets.pop(); save(); render(); break;
    case 'rest-skip': stopRest(); break;
    case 'rest-add': restEnd += 30000; tick(); break;
    case 'month': calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + Number(b.dataset.d), 1); render(); break;
    case 'add-day': {
      const k = b.dataset.day, future = k > dayKey();
      pickClass(future ? `Plan a class · ${fmtDay(k)}` : `Add a class · ${fmtDay(k)}`, (planId, home) => {
        const extra = home ? { home } : {};
        if (future) db.planned.push({ id: uid(), planId, date: k, ...extra });
        else db.sessions.push({ id: uid(), planId, date: k, start: fromKey(k).getTime(), duration: 0, exercises: [], quick: true, ...extra });
        save(); render();
      });
      break;
    }
    case 'open-plan': {
      // opening a planned home leg day switches Leg Day to home mode
      const x = db.planned.find(p => p.id === b.dataset.id), p = planById(x.planId);
      if (p.modes) { setMode(p, x.home ? 'alt' : 'main'); save(); }
      location.hash = '#/class/' + p.id;
      break;
    }
    case 'del-session': if (confirm('Delete this workout from your history?')) { db.sessions = db.sessions.filter(s => s.id !== b.dataset.id); save(); render(); } break;
    case 'del-plan': db.planned = db.planned.filter(p => p.id !== b.dataset.id); save(); render(); break;
    case 'metric': progMetric = b.dataset.m; render(); break;
    case 'unit': db.settings.unit = b.dataset.u; save(); render(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify({ app: 'gym-tracker', version: 1, exported: new Date().toISOString(), ...db }, null, 2)], { type: 'application/json' });
      const link = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `gym-tracker-backup-${dayKey()}.json` });
      link.click(); setTimeout(() => URL.revokeObjectURL(link.href), 1000);
      break;
    }
    case 'import': $('#importFile').click(); break;
    case 'reset': if (confirm('Delete ALL workouts, plans and settings? Export a backup first if you want to keep them.') && confirm('Are you sure? This cannot be undone.')) { db = blank(); save(); render(); } break;
  }
});

document.addEventListener('input', e => {
  const t = e.target;
  const row = t.closest('.setrow');
  if (row && t.dataset.f) { db.active.exercises[row.dataset.i].sets[row.dataset.j][t.dataset.f] = t.value; save(); return; }
  if (t.dataset.ov) {
    const o = db.overrides[t.dataset.ov] = db.overrides[t.dataset.ov] || {};
    o[t.dataset.k] = t.dataset.k === 'sets' ? (parseInt(t.value) || '') : t.value;
    save();
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.act === 'prog-ex') { progEx = t.value; progMetric = 'top'; render(); }
  if (t.dataset.act === 'rest-set') { db.settings.rest = Number(t.value); save(); }
  if (t.id === 'importFile' && t.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const data = JSON.parse(r.result);
        if (!Array.isArray(data.sessions)) throw new Error('not a backup');
        if (!confirm(`Import ${data.sessions.length} workouts? This replaces the data in this browser.`)) return;
        const { app, version, exported, ...rest } = data;
        db = migrate(Object.assign(blank(), rest)); save(); render();
        alert('Backup imported ✓');
      } catch (err) { alert('That file is not a Gym Tracker backup.'); }
    };
    r.readAsText(t.files[0]);
    t.value = '';
  }
});

save(); // stores any migration of older data
render();

// Installable app: offline support, and ask the phone not to clear your saved workouts
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').catch(err => console.warn('Offline support unavailable', err));
}
try { navigator.storage?.persist?.(); } catch (e) {}
</script>
</body>
</html>
